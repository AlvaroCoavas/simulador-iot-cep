; ===========================================================================
; Simulador IoT & Control Estadistico de Procesos (CEP)
; Plataforma: ESP32 (board esp32dev) -> parte Wokwi board-esp32-devkit-c-v4
;
; Versiones de librerias fijadas a las compatibles con el core de ESP32 de Wokwi.
; ===========================================================================

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.9.1
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.9
    adafruit/Adafruit BusIO@1.14.5

build_flags =
    -Wall
    -DARDUINO_LOOP_STACK_SIZE=12288
