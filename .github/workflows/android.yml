name: Compilar APK Android

# Genera el APK de la app movil con la imagen oficial de buildozer.
# El APK queda como artefacto descargable desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: APK (Kivy + buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # VIA 1 (preferida): imagen oficial de buildozer.
      # Trae el SDK de Android, el NDK y todas las herramientas ya
      # configuradas, que es donde mas fallos se dan al compilar a mano.
      # ------------------------------------------------------------------
      - name: Compilar el APK (Docker)
        id: docker
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            kivy/buildozer:latest \
            android debug
          ls -la bin/ || true

      # ------------------------------------------------------------------
      # VIA 2 (alternativa): buildozer instalado con pip.
      # `libtool-bin` es imprescindible: sin el, `autoreconf` falla con
      # "possibly undefined macro: LT_SYS_SYMBOL_USCORE" al compilar el
      # interprete de Python para el host.
      # ------------------------------------------------------------------
      - name: Compilar el APK (pip, alternativa)
        if: failure() && steps.docker.outcome == 'failure'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev
          python3 -m pip install --user --upgrade buildozer cython==0.29.36 virtualenv
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug
          ls -la bin/ || true

      - name: Comprobar que hay APK
        run: |
          if [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "::error::No se ha generado ningun APK"
            exit 1
          fi
          ls -la bin/*.apk

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorCEP-movil-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Crear release (solo si es un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          name: Simulador CEP - Android
          body: |
            App movil del Simulador IoT & CEP (Kivy).

            - Instalar el `.apk` en el telefono (hay que permitir "instalar
              apps de origen desconocido" para ese archivo).
            - Necesita internet para recibir los datos por MQTT del ESP32
              simulado en Wokwi.
            - Los limites de control se modifican desde el panel de
              escritorio; la app movil solo los muestra.
