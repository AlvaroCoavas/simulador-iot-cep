name: Compilar APK Android

# Genera el APK de la app movil con la imagen oficial de buildozer.
# El APK queda como artefacto descargable desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: APK (Kivy + buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Preparar python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev
          python3 -m pip install --user buildozer cython==0.29.36 virtualenv

      - name: Compilar el APK
        run: |
          # El buildozer de python-for-android necesita una version concreta de
          # Cython y un SDK/NDK propios; se deja que los descargue.
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug \
            --arch arm64-v8a \
            --arch armeabi-v7a \
            --arch x86_64

      - name: Mostrar los artefactos generados
        run: ls -la bin/ || true

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SimuladorCEP-movil-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Crear release (solo si es un tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          name: Simulador CEP - Android
          body: |
            App movil del Simulador IoT & CEP (Kivy).

            - Instalar el `.apk` en el telefono (hay que permitir "instalar
              apps de origen desconocido" para ese archivo).
            - Necesita internet para recibir los datos por MQTT del ESP32
              simulado en Wokwi.
            - Los limites de control se modifican desde el panel de
              escritorio; la app movil solo los muestra.
